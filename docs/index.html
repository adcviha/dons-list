<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don's List — Nanaimo Rental Housing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #1a1a1a;
      background: #faf8f5;
      line-height: 1.45;
    }

    /* ---- Header ---- */
    .header {
      background: #fff;
      border-bottom: 3px solid #556b2f;
      padding: 1.5rem 1.25rem 1rem;
      text-align: center;
    }
    .header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #1a1a1a;
      text-transform: uppercase;
    }
    .header .subtitle {
      margin-top: 0.2rem;
      font-size: 0.9rem;
      color: #556b2f;
      font-style: italic;
    }
    .header .meta {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: #888;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header .tribute {
      margin-top: 0.3rem;
      font-size: 0.6rem;
      color: #aaa;
      font-style: italic;
    }

    /* ---- Controls ---- */
    .controls {
      max-width: 960px;
      margin: 1rem auto 0;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.9rem;
      font-size: 0.75rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 600;
      border: 1.5px solid #556b2f;
      border-radius: 3px;
      cursor: pointer;
      background: #fff;
      color: #556b2f;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn:hover { background: #556b2f; color: #fff; }
    .count { font-size: 0.75rem; color: #999; font-family: system-ui, -apple-system, sans-serif; }

    /* ---- Table ---- */
    .table-wrap {
      max-width: 960px;
      margin: 0.5rem auto 1.5rem;
      padding: 0 1rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e0dcd5;
    }
    thead { background: #556b2f; }
    th {
      text-align: left;
      padding: 0.55rem 0.75rem;
      font-size: 0.68rem;
      font-family: system-ui, -apple-system, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      border-bottom: 1px solid #e8e4dc;
      vertical-align: top;
    }
    tbody tr:nth-child(even) { background: #fbfaf7; }
    tbody tr:hover { background: #f3f1ea; }
    td:first-child { font-weight: 600; }

    .badge {
      display: inline-block;
      font-size: 0.58rem;
      font-weight: 700;
      padding: 0.1em 0.45em;
      border-radius: 2px;
      letter-spacing: 0.04em;
      vertical-align: middle;
      margin-left: 0.3rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .badge-cl { background: #e8ecf1; color: #4a6a8a; }
    .badge-kj { background: #fdf0e5; color: #8b5e3c; }

    .contact-col a {
      color: #556b2f;
      text-decoration: none;
      font-weight: 600;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
    }
    .contact-col a:hover { text-decoration: underline; }

    /* ---- State ---- */
    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #aaa;
      font-style: italic;
      font-size: 0.95rem;
    }
    .error-banner {
      max-width: 960px;
      margin: 0.75rem auto;
      padding: 0.5rem 0.75rem;
      background: #fef9ee;
      border-left: 3px solid #e6b422;
      color: #8b6914;
      font-size: 0.75rem;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ---- Footer ---- */
    .footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.65rem;
      color: #bbb;
      font-family: system-ui, -apple-system, sans-serif;
      border-top: 1px solid #e8e4dc;
    }

    /* ---- Print ---- */
    @media print {
      body { background: #fff; color: #000; }
      .header { border-bottom: 2px solid #000; padding: 0.4rem 0; }
      .header h1 { color: #000; }
      .header .subtitle { color: #000; }
      .header .meta, .header .tribute, .controls, .badge { display: none; }
      .table-wrap { margin-top: 0.25rem; }
      table { border: 1px solid #000; }
      thead { background: #ddd; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      th { color: #000; border-bottom: 2px solid #000; }
      td { border-color: #ccc; }
      .btn { display: none; }
      .footer { border-top: 1px solid #ccc; color: #999; }
      .contact-col a { color: #000; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Don's List</h1>
    <p class="subtitle">Private rental housing — Nanaimo, British Columbia</p>
    <p class="meta">Updated <span id="updated">loading&hellip;</span> &middot; Listings &le;&nbsp;$<span id="max-price">1,500</span></p>
    <p class="tribute">In memory of Don Fraser</p>
  </header>

  <div class="controls">
    <button class="btn" onclick="window.print()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5V2h8v3M3 11H2V7h12v4h-1"/><rect x="4" y="9" width="8" height="5" rx="1"/></svg>
      Print
    </button>
    <span class="count" id="count"></span>
  </div>

  <main class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Location</th>
          <th>Type</th>
          <th>Price</th>
          <th>Contact</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="empty" id="empty-msg" hidden>No listings yet. Check back soon.</p>
  </main>

  <footer class="footer">
    Refreshed every Monday, Wednesday &amp; Friday. A community project for Nanaimo renters.
  </footer>

  <script>
    (async () => {
      const tbody  = document.getElementById("tbody");
      const empty  = document.getElementById("empty-msg");
      const count  = document.getElementById("count");
      const updated = document.getElementById("updated");
      const maxPriceEl = document.getElementById("max-price");

      try {
        const resp = await fetch("listings.json", { cache: "no-cache" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const listings = data.listings || [];

        updated.textContent = data.last_updated
          ? new Date(data.last_updated).toLocaleString("en-CA", { dateStyle: "long", timeStyle: "short", timeZone: "America/Vancouver" })
          : "unknown";

        if (data.max_price) maxPriceEl.textContent = data.max_price.toLocaleString();

        if (data.error) {
          const banner = document.createElement("div");
          banner.className = "error-banner";
          banner.textContent = data.error;
          document.querySelector(".table-wrap").before(banner);
        }

        if (!listings.length) {
          empty.hidden = false;
          count.textContent = "";
          return;
        }

        empty.hidden = true;
        count.textContent = `${listings.length} listing${listings.length !== 1 ? "s" : ""}`;

        for (const l of listings) {
          const tr = document.createElement("tr");
          const srcBadge = l.source ? sourceBadge(l.source) : "";
          tr.innerHTML = [
            `<td>${esc(l.address || "Nanaimo")}${srcBadge}</td>`,
            `<td>${esc(l.size || "Unknown")}</td>`,
            `<td>${esc(l.price || "N/A")}</td>`,
            `<td class="contact-col">${contactHtml(l)}</td>`,
          ].join("");
          tbody.appendChild(tr);
        }
      } catch (err) {
        empty.hidden = false;
        empty.textContent = "Could not load listings — check back soon.";
        updated.textContent = "unavailable";
        console.error(err);
      }
    })();

    function esc(s) {
      const el = document.createElement("span");
      el.textContent = s;
      return el.innerHTML;
    }

    function sourceBadge(src) {
      if (/craigslist/i.test(src)) return `<span class="badge badge-cl">CL</span>`;
      if (/kijiji/i.test(src)) return `<span class="badge badge-kj">KJ</span>`;
      return "";
    }

    function contactHtml(l) {
      if (!l.contact || l.contact === "See listing") {
        return l.link ? `<a href="${esc(l.link)}" target="_blank" rel="noopener">View &rarr;</a>` : "—";
      }
      if (/^\d/.test(l.contact) || l.contact.includes("Reply")) {
        const phone = esc(l.contact);
        const link  = l.link ? ` <a href="${esc(l.link)}" target="_blank" rel="noopener">(listing)</a>` : "";
        return phone + link;
      }
      return esc(l.contact);
    }
  </script>
</body>
</html>
