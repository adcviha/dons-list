name: Scrape Nanaimo Rentals

on:
  schedule:
    # 7 AM Pacific (14:00 UTC) every Monday, Wednesday, Friday
    - cron: "0 14 * * 1,3,5"
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to push updated listings.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated listings (if changed)
        run: |
          git config user.name  "dons-list-bot[bot]"
          git config user.email "dons-list-bot[bot]@users.noreply.github.com"
          git add docs/listings.json
          git diff --staged --quiet || git commit -m "Update rental listings [skip ci]"
          git push
